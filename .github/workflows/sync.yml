name: Sync OneDrive CSVs to ICS

on:
  schedule:
    # How often to check OneDrive for changes. GitHub's scheduler can lag
    # by a few minutes on top of this, especially on low-activity public
    # repos - that's a GitHub-side limit, not something we control.
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: ics-sync
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install rclone
        run: curl https://rclone.org/install.sh | sudo bash

      - name: Write rclone config from secret
        run: |
          mkdir -p ~/.config/rclone
          printf '%s' "${{ secrets.RCLONE_CONFIG }}" > ~/.config/rclone/rclone.conf

      - name: Mirror OneDrive CSV folder into data/
        run: |
          mkdir -p data
          rclone sync "onedrive:${{ secrets.ONEDRIVE_FOLDER_PATH }}" data/ \
            --include "*.csv" --checksum -v

      - name: Persist refreshed rclone token, if it changed
        env:
          GH_TOKEN: ${{ secrets.SECRETS_PAT }}
        run: |
          NEW_CONFIG="$(cat ~/.config/rclone/rclone.conf)"
          OLD_CONFIG="${{ secrets.RCLONE_CONFIG }}"
          if [ "$NEW_CONFIG" != "$OLD_CONFIG" ]; then
            echo "rclone refreshed its token - updating the stored secret."
            gh secret set RCLONE_CONFIG --repo "${{ github.repository }}" --body "$NEW_CONFIG"
          else
            echo "Token unchanged."
          fi

      - name: Rebuild calendar.ics from current CSV files
        run: python scripts/generate_ics.py

      - name: Commit and push if changed
        run: |
          git config user.name "ics-sync-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data docs/calendar.ics
          if ! git diff --cached --quiet; then
            git commit -m "Sync from OneDrive"
            git push
          else
            echo "No changes to commit"
          fi
